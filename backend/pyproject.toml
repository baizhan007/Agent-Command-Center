[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-command-center"
version = "0.1.0"
description = "Local-first multi-agent project and task control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
